version: '3.8'

# Stack: justgui
# Serviços: Astro SSR (API em /api/*, SQLite)
# Imagem: ghcr.io/justgu1/justgui-web:${JUSTGUI_TAG:-latest}
# Deploy: docker stack deploy -c stacks/justgui.yml justgui

services:
  web:
    image: ghcr.io/justgu1/justgui-web:${JUSTGUI_TAG:-latest}
    environment:
      PUBLIC_APP_ENV: production
      PUBLIC_SITE_URL: ${URL_JUSTGUI}
      PUBLIC_LINKEDIN_URL: ${PUBLIC_LINKEDIN_URL}
      PUBLIC_GITHUB_URL: ${PUBLIC_GITHUB_URL}
      PUBLIC_INSTAGRAM_URL: ${PUBLIC_INSTAGRAM_URL}
      PUBLIC_GTM_CONTAINER_ID: ${PUBLIC_GTM_CONTAINER_ID}
      PUBLIC_CV_URL: ${PUBLIC_CV_URL:-/cv/GuilhermeSantos-Curriculo-2026.pdf}
      PUBLIC_WHATSAPP_NUMBER: ${PUBLIC_WHATSAPP_NUMBER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_JUSTGUI_USER}
      SMTP_PASSWORD: ${SMTP_JUSTGUI_PASSWORD}
      SMTP_FROM: ${SMTP_JUSTGUI_USER}
      SMTP_FROM_NAME: ${JUSTGUI_SMTP_FROM_NAME:-justgui}
      CONTACT_TO: ${JUSTGUI_CONTACT_TO}
      DATABASE_PATH: /var/www/data/justgui.sqlite
      VISITOR_IP_SALT: ${JUSTGUI_VISITOR_IP_SALT}
      TZ: America/Sao_Paulo
    volumes:
      - justgui_data:/var/www/data
    networks:
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

volumes:
  justgui_data:

networks:
  proxy:
    external: true
